{% extends "usuarios/base.html" %}
{% block titulo %}Editar perfil{% endblock %}
{% block conteudo %}
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3 mb-4">Editar perfil</h1>
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {% include "usuarios/_campos_form.html" %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
            <p class="mt-3 mb-0"><a href="{% url 'alterar_senha' %}">Alterar senha</a></p>
        </div>
    </div>
{% endblock %}
