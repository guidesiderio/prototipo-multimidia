{% extends "usuarios/base.html" %}
{% block titulo %}Registro{% endblock %}
{% block conteudo %}
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3 mb-4">Criar conta</h1>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "usuarios/_campos_form.html" %}
                <button type="submit" class="btn btn-primary">Registrar</button>
            </form>
            <p class="mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
        </div>
    </div>
{% endblock %}
